name = "cf-dkc-oauth-app"
main = "src/index.tsx"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]

[vars]
OAUTH_BASE_URI = "https://oauth.dhammakaya.network"
CAS_REQUEST_URL = "https://oauth.dhammakaya.network/api/cas/request"
CAS_STATUS_URL = "https://oauth.dhammakaya.network/api/cas/reqstat"

[[d1_databases]]
binding = "DB"
database_name = "dkcoauthtest1_cas_requests"
database_id = "e418c910-57ad-4a79-b484-76070879677c"

# Secrets (set via `wrangler secret put`):
# OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET, OAUTH_REDIRECT_URI
# SESSION_SECRET
# CAS_CLIENT_ID, CAS_CLIENT_SECRET
